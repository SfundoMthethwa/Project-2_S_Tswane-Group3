<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Gig - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f0f2f5, #e9ecef); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-wrapper { display: flex; max-width: 1200px; background: white; border-radius: 30px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.15); margin: 20px; }
        .login-sidebar { width: 40%; padding: 50px 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: 0.3s; }
        .login-sidebar.student-mode { background: linear-gradient(135deg, #1a3c5e, #2c5a7a); }
        .login-sidebar.employer-mode { background: linear-gradient(135deg, #28a745, #218838); }
        .sidebar-icon { font-size: 100px; color: white; background: rgba(255,255,255,0.15); padding: 25px; border-radius: 50%; margin-bottom: 30px; }
        .login-sidebar h2 { color: white; font-size: 28px; margin-bottom: 15px; }
        .login-sidebar p { color: rgba(255,255,255,0.9); }
        .login-form-area { width: 60%; padding: 50px; background: white; }
        .user-type-selector { display: flex; gap: 15px; margin-bottom: 30px; background: #f0f2f5; padding: 5px; border-radius: 50px; }
        .user-type { flex: 1; text-align: center; padding: 12px; border-radius: 50px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .user-type.student-type { background: #e8f0f8; color: #1a3c5e; }
        .user-type.student-type.active { background: #1a3c5e; color: white; }
        .user-type.employer-type { background: #e8f5e9; color: #28a745; }
        .user-type.employer-type.active { background: #28a745; color: white; }
        .login-form h3 { color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }
        .form-group input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        .login-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .login-btn.student-btn { background: #1a3c5e; color: white; }
        .login-btn.student-btn:hover { background: #2c5a7a; }
        .login-btn.employer-btn { background: #28a745; color: white; }
        .login-btn.employer-btn:hover { background: #218838; }
        .register-link { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        @media (max-width: 768px) { .login-wrapper { flex-direction: column; } .login-sidebar, .login-form-area { width: 100%; } }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-sidebar student-mode" id="sidebar">
            <div class="sidebar-icon" id="sidebarIcon"><i class="bi-mortarboard-fill"></i></div>
            <h2 id="sidebarTitle">Student Portal</h2>
            <p id="sidebarText">Access your dashboard to find part-time jobs, track applications, and grow your career.</p>
        </div>
        <div class="login-form-area">
            <div class="user-type-selector">
                <div class="user-type student-type active" id="studentTab"><i class="bi-mortarboard-fill"></i> Student</div>
                <div class="user-type employer-type" id="employerTab"><i class="bi-briefcase-fill"></i> Employer</div>
            </div>
            <div class="login-form">
                <h3 id="formTitle">Student Login</h3>
                <form id="loginForm">
                    <div class="form-group"><label id="emailLabel">Student Email</label><input type="email" id="email" placeholder="student@university.ac.za" required></div>
                    <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter your password" required></div>
                    <button type="submit" class="login-btn student-btn" id="loginBtn">Login as Student</button>
                </form>
                <div class="register-link"><a href="student-register.html">Register as Student</a> | <a href="employer-register.html">Register as Employer</a></div>
            </div>
        </div>
    </div>
    <script>
        const studentTab = document.getElementById('studentTab');
        const employerTab = document.getElementById('employerTab');
        const sidebar = document.getElementById('sidebar');
        const sidebarIcon = document.getElementById('sidebarIcon');
        const sidebarTitle = document.getElementById('sidebarTitle');
        const sidebarText = document.getElementById('sidebarText');
        const formTitle = document.getElementById('formTitle');
        const emailLabel = document.getElementById('emailLabel');
        const emailInput = document.getElementById('email');
        const loginBtn = document.getElementById('loginBtn');

        function switchToStudent() {
            sidebar.classList.remove('employer-mode'); sidebar.classList.add('student-mode');
            sidebarIcon.innerHTML = '<i class="bi-mortarboard-fill"></i>';
            sidebarTitle.textContent = 'Student Portal';
            sidebarText.textContent = 'Access your dashboard to find part-time jobs, track applications, and grow your career.';
            formTitle.textContent = 'Student Login';
            emailLabel.textContent = 'Student Email';
            emailInput.placeholder = 'student@university.ac.za';
            loginBtn.textContent = 'Login as Student';
            loginBtn.classList.remove('employer-btn'); loginBtn.classList.add('student-btn');
            studentTab.classList.add('active'); employerTab.classList.remove('active');
        }
        function switchToEmployer() {
            sidebar.classList.remove('student-mode'); sidebar.classList.add('employer-mode');
            sidebarIcon.innerHTML = '<i class="bi-briefcase-fill"></i>';
            sidebarTitle.textContent = 'Employer Portal';
            sidebarText.textContent = 'Post jobs, review applications, and find talented students for your business.';
            formTitle.textContent = 'Employer Login';
            emailLabel.textContent = 'Email Address';
            emailInput.placeholder = 'employer@company.co.za';
            loginBtn.textContent = 'Login as Employer';
            loginBtn.classList.remove('student-btn'); loginBtn.classList.add('employer-btn');
            employerTab.classList.add('active'); studentTab.classList.remove('active');
        }
        studentTab.addEventListener('click', switchToStudent);
        employerTab.addEventListener('click', switchToEmployer);
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (studentTab.classList.contains('active')) alert('Student login - dashboard would open');
            else alert('Employer login - dashboard would open');
        });
    </script>
</body>
</html>
